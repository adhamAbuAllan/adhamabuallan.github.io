<style>
/* Fonts: Google Fonts (Reem Kufi + IBM Plex Sans Arabic). */

:root{
  --paper:#F1EAD8;      /* wheat paper */
  --paper-2:#E8DFC7;    /* raised surface */
  --tint:#DDE1C2;       /* olive-tinted band */
  --ink:#26301A;        /* olive-black ink */
  --ink-2:#55604A;      /* muted text */
  --olive:#4C5F25;      /* olive green */
  --leaf:#94A657;       /* light leaf */
  --oil:#D2A02B;        /* oil gold, primary action */
  --oil-deep:#A87A12;
  --press:#1D2413;      /* footer, olive press dark */
  --cream:#F6F0E1;
  --line:rgba(38,48,26,.14);
  --r-sm:12px; --r-md:20px; --r-lg:28px;
  --gutter:clamp(16px,4.5vw,40px);
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --text:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.0625rem;line-height:1.85;letter-spacing:0;overflow-x:clip;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;color:transparent}
a{color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:0;margin:0;font-weight:600;line-height:1.3}
p{margin:0}
bdi{unicode-bidi:isolate}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:clamp(56px,10vw,112px)}
.h2{font-size:clamp(1.65rem,5.2vw,2.35rem);margin-block-end:12px}
.lede{color:var(--ink-2);max-width:56ch}
:focus-visible{outline:3px solid var(--olive);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{--h:56px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--h);padding-inline:26px;border-radius:999px;border:0;font:600 1.05rem/1 var(--text);text-decoration:none;cursor:pointer;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--oil);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 18px -8px rgba(168,122,18,.7)}
.btn-primary:hover{background:#DDAC37}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--olive)}
.btn svg{flex:none}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;line-height:1;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--cream);white-space:nowrap}
.demo-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--oil)}

/* Hero: the one bold move is the terraced (سناسل) edge on the photo */
.hero{padding-block:4px clamp(48px,8vw,96px)}
.hero-grid{display:grid;gap:28px}
.hero-media{position:relative;margin-inline:calc(var(--gutter) * -1);aspect-ratio:4/3;max-height:46vh;width:auto;overflow:hidden;background:#3b4a22;
  clip-path:polygon(0 0,100% 0,100% 100%,80% 100%,80% 94%,60% 94%,60% 88%,40% 88%,40% 82%,20% 82%,20% 76%,0 76%)}
.hero-media img{width:100%;height:100%;object-fit:cover}
.season{display:inline-block;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--olive);background:var(--tint);padding:4px 14px;border-radius:999px;margin-block-end:14px}
.hero h1{font-size:clamp(2.15rem,8.4vw,3.9rem);line-height:1.22;font-weight:700;max-width:14ch}
.hero .sub{margin-block-start:14px;color:var(--ink-2);font-size:1.08rem;max-width:42ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-block-start:26px}
.hero-actions .btn-primary{flex:1 1 100%}
.hero-actions .btn-ghost{flex:1 1 100%;--h:50px}
@media (min-width:560px){.hero-actions .btn-primary,.hero-actions .btn-ghost{flex:0 0 auto}}
@media (min-width:900px){
  .hero{padding-block:12px 96px}
  .hero-grid{grid-template-columns:1.05fr 1fr;align-items:center;gap:56px}
  .hero-media{order:2;margin:0;aspect-ratio:4/5;max-height:640px;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .hero-copy{order:1}
}
/* Single orchestrated load moment: words rise in, photo settles. Word-level only (Arabic joining safe). */
.js .hero h1 .w{display:inline-block;opacity:0;transform:translateY(.4em);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.js .hero-media img{transform:scale(1.06);transition:transform 1.6s var(--ease)}
.js.ready .hero h1 .w{opacity:1;transform:none}
.js.ready .hero-media img{transform:none}

/* Trust strip */
.trust{background:var(--tint)}
.trust .wrap{padding-block:clamp(32px,6vw,52px)}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:18px 28px;grid-template-columns:1fr}
@media (min-width:600px){.facts{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{display:grid;grid-template-columns:28px 1fr;gap:2px 12px;align-items:start}
.fact svg{grid-row:span 2;margin-block-start:4px;color:var(--olive)}
.fact b{font-weight:600;font-size:1.08rem;line-height:1.5}
.fact span{color:var(--ink-2);font-size:.95rem;line-height:1.6}
.analysis{margin-block-start:22px;padding-block-start:18px;border-block-start:1px solid var(--line);font-size:.95rem;color:var(--ink-2)}
.analysis a{color:var(--olive);font-weight:600;text-underline-offset:4px}

/* Story */
.story-grid{display:grid;gap:32px;align-items:center}
.story-media{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/5;background:#4a3b2c;max-height:520px}
.story-media img{width:100%;height:100%;object-fit:cover}
.story-text p{max-width:58ch}
.story-text p+p{margin-block-start:16px}
.story-text .h2{margin-block-end:18px}
@media (min-width:900px){.story-grid{grid-template-columns:1fr 1.1fr;gap:72px}}

/* Products */
.products-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin-block-end:28px}
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--paper-2);border-radius:var(--r-md);padding:22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .25s}
.card.in-order{box-shadow:inset 0 0 0 2px var(--olive)}
.card-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;min-height:96px}
.kind{font-size:1rem;color:var(--ink-2);font-weight:600}
.size{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1}
.size small{font-size:1.1rem;font-weight:500;margin-inline-start:6px;color:var(--ink-2)}
.shape{color:var(--olive);flex:none}
.card-note{color:var(--ink-2);font-size:.95rem;line-height:1.6}
.price-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block-start:14px;border-block-start:1px solid var(--line)}
.price{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1}
.cur{font-family:var(--text);font-size:1.1rem;font-weight:600;margin-inline-start:4px}
.per{font-size:.85rem;color:var(--ink-2)}
.card-actions{display:flex;gap:10px;align-items:center}
.card-actions .btn{--h:48px;flex:1;padding-inline:16px;font-size:1rem}
.in-badge{position:absolute;inset-block-start:14px;inset-inline-end:14px;font-size:.78rem;font-weight:600;background:var(--olive);color:var(--cream);padding:3px 10px;border-radius:999px;opacity:0;transform:translateY(-4px);transition:.25s var(--ease)}
.card.in-order .in-badge{opacity:1;transform:none}

/* Stepper */
.stepper{display:inline-flex;align-items:center;background:var(--paper);border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.stepper button{width:46px;height:46px;border:0;background:transparent;border-radius:999px;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.stepper button:hover{background:rgba(76,95,37,.1)}
.stepper button:disabled{opacity:.35;cursor:default;background:transparent}
.stepper output{min-width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.2rem}

/* Order form */
.order{background:var(--ink);color:var(--cream)}
.order .lede{color:#C9CDB6}
.order-grid{display:grid;gap:28px}
@media (min-width:900px){.order-grid{grid-template-columns:.85fr 1.15fr;gap:64px;align-items:start}}
.form{background:var(--cream);color:var(--ink);border-radius:var(--r-lg);padding:clamp(20px,4vw,32px);display:grid;gap:20px}
.field{display:grid;gap:6px}
.field label,.legend{font-weight:600;font-size:.98rem}
.field input,.field textarea{width:100%;font:400 1rem/1.5 var(--text);color:var(--ink);background:#fff;border:1.5px solid rgba(38,48,26,.22);border-radius:var(--r-sm);padding:13px 14px;min-height:52px;transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:88px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#8A8F7C}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px rgba(76,95,37,.18)}
.field.invalid input{border-color:#A3361E}
.err{color:#A3361E;font-size:.88rem;line-height:1.5;min-height:0}
.err:empty{display:none}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;margin-inline:-10px;border-radius:var(--r-sm);transition:background-color .6s}
.line.flash{background:rgba(210,160,43,.28)}
.line-name{font-weight:600;line-height:1.4}
.line-name small{display:block;font-weight:400;color:var(--ink-2);font-size:.85rem}
.line .stepper button{width:42px;height:42px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-block-start:14px;border-block-start:1px solid var(--line)}
.total strong{font-family:var(--display);font-size:1.7rem;line-height:1}
.form .btn-primary{width:100%;--h:58px;font-size:1.1rem}
.form-note{font-size:.88rem;color:var(--ink-2);text-align:center;line-height:1.6}
.demo-note{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.6;color:#C9CDB6;margin-block-start:18px}
.demo-note svg{flex:none;margin-block-start:3px;color:var(--oil)}

/* Steps */
.steps{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:22px;counter-reset:s}
@media (min-width:800px){.steps{grid-template-columns:repeat(3,1fr);gap:36px}}
.step{display:grid;grid-template-columns:48px 1fr;gap:4px 14px;counter-increment:s}
.step::before{content:counter(s);grid-row:span 2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--olive);font:700 1.3rem/1 var(--display)}
.step b{font-size:1.12rem;font-weight:600;line-height:1.6}
.step span{color:var(--ink-2)}

/* Delivery */
.delivery{background:var(--paper-2)}
.areas{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.areas li{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--paper);font-weight:600}
.areas li svg{color:var(--olive)}
.areas li.abroad{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.areas li.abroad a{color:var(--olive);text-underline-offset:4px}
.delivery-note{margin-block-start:18px;color:var(--ink-2);max-width:60ch}

/* Gallery */
.gallery{display:grid;gap:10px;grid-template-columns:1fr 1fr;grid-auto-flow:dense;margin-block-start:28px}
.gallery figure{margin:0;position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:1;background:#3b4a22}
/* Mobile: wide items and the last item span both columns, so 6 photos tile with no holes */
.gallery figure.wide,.gallery figure:last-child{grid-column:span 2;aspect-ratio:16/9}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery figcaption{position:absolute;inset-inline:0;inset-block-end:0;padding:24px 12px 10px;font-size:.85rem;font-weight:600;color:#fff;background:linear-gradient(to top,rgba(20,24,12,.72),transparent)}
/* Desktop: 4 columns x 2 rows = [tall][wide wide][1] / [tall][1][1][1] */
@media (min-width:900px){
  .gallery{grid-template-columns:repeat(4,1fr);grid-auto-rows:240px;gap:14px}
  .gallery figure,.gallery figure:last-child{aspect-ratio:auto;grid-column:auto}
  .gallery figure.wide{grid-column:span 2;aspect-ratio:auto}
  .gallery figure.tall{grid-row:span 2}
}

/* FAQ */
.faq-list{margin-block-start:24px;max-width:760px}
.faq-list details{border-block-end:1px solid var(--line)}
.faq-list summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px;font-weight:600;font-size:1.08rem;line-height:1.6}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary .pm{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--olive);transition:transform .25s var(--ease)}
.faq-list details[open] summary .pm{transform:rotate(45deg)}
.faq-list details p{padding-block-end:18px;color:var(--ink-2);max-width:62ch}

/* Footer: dark press with terraced top edge */
.foot{background:var(--press);color:var(--cream);position:relative;margin-block-start:40px;padding-block:72px 110px}
.foot::before{content:"";position:absolute;inset-inline:0;inset-block-end:100%;height:40px;background:var(--press);
  clip-path:polygon(0 100%,0 75%,25% 75%,25% 50%,50% 50%,50% 25%,75% 25%,75% 0,100% 0,100% 100%)}
.foot-grid{display:grid;gap:28px}
@media (min-width:800px){.foot-grid{grid-template-columns:1.2fr 1fr;align-items:end}.foot{padding-block-end:56px}}
.foot .brand-name{font-size:1.6rem}
.foot p{color:#C3C7AF}
.foot .btn-ghost{color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(246,240,225,.3);margin-block-start:18px;--h:50px}
.foot .btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--oil)}
.phone{font-family:var(--display);font-size:1.15rem;margin-block-start:10px}
.credit{display:grid;gap:4px;padding:18px 20px;border-radius:var(--r-md);background:rgba(246,240,225,.06);box-shadow:inset 0 0 0 1px rgba(210,160,43,.35)}
.credit span{color:#C3C7AF;font-size:.95rem}
.credit a{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--oil);text-decoration:none}
.credit a:hover{text-decoration:underline;text-underline-offset:5px}
.photo-credit{margin-block-start:32px;padding-block-start:18px;border-block-start:1px solid rgba(246,240,225,.12);font-size:.8rem;color:#9DA28A;line-height:1.7}
.photo-credit a{color:#C3C7AF;white-space:nowrap}

/* Floating WhatsApp (mobile) */
.wa-float{position:fixed;inset-block-end:calc(16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:20;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#1F8B4C;color:#fff;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);text-decoration:none;opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.wa-float.show{opacity:1;transform:none;pointer-events:auto}
@media (min-width:900px){.wa-float{display:none}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .js .hero h1 .w{opacity:1;transform:none}
  .js .hero-media img{transform:none}
}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>

<header class="wrap top">
  <a class="brand" href="#top" id="top" aria-label="الصفحة الرئيسية">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#26301A"/><ellipse cx="30" cy="38" rx="12" ry="16" fill="#D2A02B"/><path d="M33 22c4-9 13-11 19-10-2 8-10 12-19 10z" fill="#94A657"/></svg>
    <span class="brand-name" data-bind="brand.name"></span>
  </a>
  <span class="demo-badge" data-bind="brand.demoLabel" hidden></span>
</header>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <div class="wrap hero-grid">
      <div class="hero-media" id="hero-media"></div>
      <div class="hero-copy">
        <span class="season" data-bind="hero.season"></span>
        <h1 id="hero-title" data-bind="hero.title"></h1>
        <p class="sub" data-bind="hero.subtitle"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#order" id="hero-cta">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
            <span data-bind="hero.ctaPrimary"></span>
          </a>
          <a class="btn btn-ghost" href="#products" data-bind="hero.ctaSecondary"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="trust" aria-label="ليش زيتنا">
    <div class="wrap">
      <ul class="facts" id="facts"></ul>
      <p class="analysis" id="analysis"></p>
    </div>
  </section>

  <section class="section" aria-labelledby="story-title">
    <div class="wrap story-grid">

(() => {
  const $ = (s, r = document) => r.querySelector(s);

  const num = n => new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 }).format(n);

  const get = path => path.split(".").reduce((o, k) => (o == null ? o : o[k]), SITE);
  const wa = (phone, text) => `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

  // Responsive image from an Unsplash URL or a local path

  function img(o, { sizes = "100vw", eager = false } = {}) {
    const srcset = isUnsplash(o.src) ? ` srcset="${[480, 800, 1200, 1600].map(w => `${sized(o.src, w)} ${w}w`).join(", ")}" sizes="${sizes}"` : "";
    const src = isUnsplash(o.src) ? sized(o.src, 1200) : o.src;
    return `<img src="${esc(src)}"${srcset} alt="${esc(o.alt)}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" style="background:${esc(o.color || "#3b4a22")}">`;
  }

  // Plain text bindings
  document.querySelectorAll("[data-bind]").forEach(el => { const v = get(el.dataset.bind); if (v != null) el.textContent = v; });
  document.title = `${SITE.brand.name} | ${SITE.hero.title}`;

  // Demo flags
  if (SITE.brand.demo) { $(".demo-badge").hidden = false; $("#demo-note").hidden = false; }

  // Hero: word-level split only (keeps Arabic letters joined)
  const h1 = $("#hero-title");
  h1.innerHTML = SITE.hero.title.split(/(\s+)/).map((w, i) => /^\s+$/.test(w) ? w : `<span class="w" style="transition-delay:${120 + i * 45}ms">${esc(w)}</span>`).join("");
  $("#hero-media").innerHTML = img(SITE.hero.image, { sizes: "(min-width:900px) 50vw, 100vw", eager: true });

  // Trust
  const leaf = `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 4c-8 0-14 4-14 11 0 1.4.3 2.6.8 3.6L4 21.4 5.4 23l2.9-2.9c1 .5 2.2.8 3.7.8 7 0 8-8 8-16zm-8 14.8c-.9 0-1.7-.2-2.4-.5l6-6-1.4-1.4-6 6c-.3-.7-.5-1.5-.5-2.4 0-5 4-8.3 10.2-8.9-.4 7.6-1.9 13.2-5.9 13.2z"/></svg>`;
  $("#facts").innerHTML = SITE.trust.map(f => `<li class="fact">${leaf}<b>${esc(f.title)}</b><span>${esc(f.text)}</span></li>`).join("");
  const askAnalysis = wa(SITE.contact.whatsapp, `${SITE.contact.messageIntro}\n\nبدي أشوف نتيجة تحليل الزيت.`);
  $("#analysis").innerHTML = `${esc(SITE.analysisNote.text)} <a href="${askAnalysis}" target="_blank" rel="noopener">${esc(SITE.analysisNote.link)}</a>`;

  // Story
  $("#story-media").innerHTML = img(SITE.story.image, { sizes: "(min-width:900px) 45vw, 100vw" });
  $("#story-body").innerHTML = SITE.story.paragraphs.map(p => `<p>${esc(p)}</p>`).join("");

  // Products + shared cart state
  const shapes = {
    tin: h => `<svg class="shape" width="${h * .72}" height="${h}" viewBox="0 0 54 75" aria-hidden="true"><path d="M14 10V5h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="33" y="3" width="10" height="8" rx="1.5" fill="currentColor"/><rect x="3" y="11" width="48" height="62" rx="4" fill="currentColor"/><rect x="10" y="30" width="34" height="22" rx="2" fill="#E8DFC7" opacity=".35"/></svg>`,

    const { items, sum } = totals();
    const name = $("#name").value.trim(), area = $("#area").value.trim(), notes = $("#notes").value.trim();
    const lines = items.map(p => `• ${label(p)} × ${cart[p.id]} = ${num(p.price * cart[p.id])} ${SITE.currency}`);
    return [
      SITE.contact.messageIntro, "",
      `طلب من ${SITE.brand.name}:`, ...lines,
      `المجموع: ${num(sum)} ${SITE.currency}`, "",
      `الاسم: ${name}`, `المنطقة: ${area}`,
      ...(notes ? [`ملاحظات: ${notes}`] : [])
    ].join("\n");
  }
  window.buildOrderUrl = () => wa(SITE.contact.whatsapp, buildMessage());

  function check(id, msg) {
    const ok = $("#" + id).value.trim().length > 1;
    $("#f-" + id).classList.toggle("invalid", !ok);
    $("#" + id).setAttribute("aria-invalid", String(!ok));
    $(`#${id}-err`).textContent = ok ? "" : msg;
    return ok;
  }
  $("#order-form").addEventListener("submit", e => {
    e.preventDefault();
    const okItems = totals().items.length > 0;
    $("#lines-err").textContent = okItems ? "" : "اختار منتج واحد عالأقل.";
    const okArea = check("area", "اكتب منطقتك عشان نرتب التوصيل.");
    const okName = check("name", "اكتب اسمك عشان نعرف صاحب الطلب.");
    if (!okName) return $("#name").focus();
    if (!okArea) return $("#area").focus();
    if (!okItems) return $("#lines button").focus();
    const url = window.buildOrderUrl();
    $("#order-form").dataset.lastUrl = url;
    // window.open with "noopener" always returns null, so detach the opener by hand instead.
    const w = window.open(url, "_blank");
    if (w) w.opener = null; else location.href = url;
  });
  ["name", "area"].forEach(id => $("#" + id).addEventListener("input", () => { if ($("#f-" + id).classList.contains("invalid")) check(id, $(`#${id}-err`).textContent); }));

  // Steps, delivery, gallery, FAQ
  $("#steps").innerHTML = SITE.steps.map(s => `<li class="step"><b>${esc(s.title)}</b><span>${esc(s.text)}</span></li>`).join("");
  const pin = `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>`;
  const askAbroad = wa(SITE.contact.whatsapp, `${SITE.contact.messageIntro}\n\nبدي أسأل عن التوصيل للخارج.`);
  $("#areas").innerHTML = SITE.delivery.areas.map(a => `<li>${pin}${esc(a)}</li>`).join("") +
    `<li class="abroad"><a href="${askAbroad}" target="_blank" rel="noopener">${esc(SITE.delivery.abroad)}</a></li>`;
  $("#gallery").innerHTML = SITE.gallery.map(g => `<figure class="${esc(g.layout || "")}">${img(g, { sizes: "(min-width:900px) 25vw, 50vw" })}<figcaption>${esc(g.caption)}</figcaption></figure>`).join("");
  $("#faq").innerHTML = SITE.faq.map(f => `<details><summary>${esc(f.q)}<span class="pm" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span></summary><p>${esc(f.a)}</p></details>`).join("");

  // Footer + floating button
  $("#phone").textContent = SITE.contact.phoneDisplay;
  const quick = wa(SITE.contact.whatsapp, `${SITE.contact.messageIntro}\n\n${SITE.contact.quickQuestion}`);
  $("#foot-wa").href = quick; $("#wa-float").href = quick;
  const c = SITE.credit;
  $("#credit").innerHTML = `<span>${esc(c.by)}</span><a href="${wa(c.whatsapp, c.message)}" target="_blank" rel="noopener">${esc(c.cta)}<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="transform:scaleX(-1)"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`;
  $("#photo-credit").innerHTML = "الصور من <a href=\"https://unsplash.com\" target=\"_blank\" rel=\"noopener\">Unsplash</a>: " +
    SITE.photoCredits.map(p => `<a href="${esc(p.url)}?utm_source=olive_demo&utm_medium=referral" target="_blank" rel="noopener"><bdi>${esc(p.name)}</bdi></a>`).join("، ");

  // Floating WhatsApp: hidden over the hero CTA and the order form
  const fl = $("#wa-float"), hidden = new Set();
  const io = new IntersectionObserver(es => { es.forEach(x => x.isIntersecting ? hidden.add(x.target) : hidden.delete(x.target)); fl.classList.toggle("show", hidden.size === 0); }, { threshold: 0 });
  [$("#hero-cta"), $("#order")].forEach(el => io.observe(el));

  render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add("ready")));
})();
</script>
</body>
</html>
