<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(var(--line) 1.5px, transparent 1.5px); background-size: 48px 48px; opacity: .55; }
  .top { position: absolute; top: 120px; right: 80px; left: 80px; text-align: right; }
  .chip { display: inline-block; font-size: 30px; font-weight: 600; color: var(--on-emerald); background: var(--emerald); padding: 8px 22px; border-radius: var(--r-pill); margin-bottom: 26px; }
  .hook { font-size: 82px; line-height: 1.18; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
  .sub { font-size: 38px; line-height: 1.4; color: var(--muted); margin: 22px 0 0; font-weight: 500; }
  .phone { position: absolute; left: 50%; top: 600px; width: 640px; height: 1180px; margin-left: -320px; border-radius: 76px; background: var(--surface-2); padding: 14px; box-shadow: 0 0 0 2px var(--line); }
  .screen { position: relative; width: 612px; height: 1152px; border-radius: 64px; overflow: hidden; background: #000; }
  .page { position: absolute; top: 58px; left: 0; width: 612px; will-change: transform; }
  .hdr { position: absolute; top: 58px; left: 0; width: 612px; z-index: 2; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 58px; background: #000; z-index: 2; }
  .notch { position: absolute; top: 12px; left: 50%; width: 150px; height: 40px; margin-left: -75px; border-radius: 40px; background: #000; z-index: 3; }
  .tap { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 6px solid var(--emerald); z-index: 4; opacity: 0; }
  .foot { position: absolute; bottom: 64px; left: 80px; right: 80px; display: flex; align-items: center; justify-content: space-between; }
  .foot img { height: 78px; }
  .foot .note { font-size: 30px; color: var(--muted); font-weight: 500; }
  .end { position: absolute; inset: 0; background: var(--ink-950); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; text-align: center; padding: 0 90px; }
  .end img { width: 520px; }
  .end h2 { font-size: 78px; line-height: 1.2; margin: 70px 0 0; font-weight: 700; }
  .end .cta { margin-top: 60px; display: inline-flex; align-items: center; gap: 22px; background: var(--emerald); color: var(--on-emerald); font-size: 50px; font-weight: 700; padding: 30px 60px; border-radius: var(--r-pill); }
  .end .cta svg { width: 54px; height: 54px; }
  .end .small { margin-top: 40px; font-size: 36px; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="top" id="top">
  <span class="chip" id="chip"></span>
  <h1 class="hook" id="hook"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="phone" id="phone">
  <div class="screen">
    <img class="page" id="page">
    <img class="hdr" id="hdr">
    <div class="status"></div>
    <div class="notch"></div>
    <div class="tap" id="tap"></div>
  </div>
</div>
<div class="foot" id="foot">
  <span class="note" id="note"></span>
  <img src="out/brand/sahl-wordmark.svg" alt="">
</div>
<div class="end" id="end">
  <img src="out/brand/sahl-wordmark.svg" alt="">
  <h2 id="endTitle"></h2>
  <div class="cta" id="cta"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg><span id="ctaText"></span></div>
  <div class="small" id="endSmall"></div>
</div>
<script>
const C = window.__CFG__;
document.getElementById('chip').textContent = C.chip;
document.getElementById('hook').innerHTML = C.hook;
document.getElementById('sub').textContent = C.sub;
document.getElementById('note').textContent = C.note;
document.getElementById('endTitle').textContent = C.endTitle;
document.getElementById('ctaText').textContent = C.cta;
document.getElementById('endSmall').textContent = C.endSmall;
const page = document.getElementById('page'); page.src = C.tall;
const hdr = document.getElementById('hdr'); hdr.src = C.header;
const S = 612 / 375;                       // css px -> screen px
const visible = (1152 - 58) / S;                  // page px visible in the screen
const maxScroll = Math.min(C.scrollTo, C.tallH - visible);
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
// scroll segments: [start s, end s, from fraction, to fraction]
const SEG = C.segments;
window.render = (t) => {
  const top = document.getElementById('top'), phone = document.getElementById('phone'), foot = document.getElementById('foot'), end = document.getElementById('end');
  const intro = ease(clamp(t / 0.7));
  top.style.opacity = intro; top.style.transform = `translateY(${(1-intro)*30}px)`;
  phone.style.opacity = clamp(t / 0.5); phone.style.transform = `translateY(${(1-intro)*160}px)`;
  foot.style.opacity = intro;
  let f = 0;
  for (const [a, b, x, y] of SEG) { if (t >= b) f = y; else if (t > a) { f = x + (y - x) * ease((t - a) / (b - a)); break; } else { f = x; break; } }
  page.style.transform = `translateY(${-f * maxScroll * S}px)`;
  // a tap ring on the booking button near the end of the scroll
  const tap = document.getElementById('tap');
  const tt = clamp((t - C.tapAt) / 0.5);
  tap.style.left = C.tapX + 'px'; tap.style.top = C.tapY + 'px';
  tap.style.opacity = tt > 0 && tt < 1 ? 1 - tt : 0; tap.style.transform = `scale(${0.6 + tt * 0.8})`;
  const e = ease(clamp((t - C.endAt) / 0.5));
  end.style.opacity = e;
  document.getElementById('cta').style.transform = `scale(${0.9 + 0.1 * ease(clamp((t - C.endAt - 0.4) / 0.4))})`;
};
window.render(0);
</script>
</body>
</html>
