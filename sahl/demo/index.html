<style>

.ribbon b{color:var(--sahl)}
.hero{position:relative;height:300px;overflow:hidden;background:#222}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.88}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.05) 60%)}

.kind{display:inline-block;font-size:.78rem;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:2px 10px;border-radius:99px}
h1{margin:8px 0 2px;font-size:2rem;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.town{opacity:.9;font-size:.95rem}
.cta{display:flex;gap:10px;margin:16px 0 4px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:700;text-decoration:none;font-size:1rem}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{background:var(--soft);color:var(--ink);font-size:.85rem;padding:4px 12px;border-radius:99px}
section{margin:26px 0}
h2{font-size:1.2rem;margin:0 0 10px}
.note{font-size:.78rem;color:var(--muted);margin:-6px 0 10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-weight:600}
.row .d{display:block;font-size:.82rem;color:var(--muted);font-weight:400}
.price{white-space:nowrap;font-weight:700;color:var(--accent);direction:ltr}
.info{display:grid;gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.box b{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.sahl{background:var(--sahl-dark);color:#fff;border-radius:22px;padding:22px 20px;margin:30px 0 22px}
.sahl h2{color:#fff;font-size:1.25rem}
.sahl p{margin:6px 0 0;color:#CFE9DA}
.sahl .big{font-size:2rem;font-weight:700;color:var(--sahl);direction:ltr;display:inline-block}
.sahl ul{margin:12px 0 16px;padding:0 18px 0 0;color:#E7F8EE}
:lang(he) .sahl ul{padding:0 18px 0 0}
.sahl .btn{background:var(--sahl);color:#04210F}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.sticky{position:fixed;inset-inline:0;bottom:0;padding:10px var(--g) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:none}
.sticky .btn{max-width:528px;margin:0 auto}
@media (max-width:600px){.sticky{display:block} footer{padding-bottom:90px}}
