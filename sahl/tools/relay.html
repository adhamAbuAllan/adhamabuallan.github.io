<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sahl media relay</title>
<meta name="robots" content="noindex"></head>
<body style="background:#0A0A0A;color:#A3AFA7;font:14px system-ui;padding:16px">
<p id="s">Preparing image…</p>
<script>
// Hands one image from this site to the Facebook tab that opened this page (Page setup uploads).
(async () => {
  const s = document.getElementById('s');
  try {
    const path = decodeURIComponent(location.hash.slice(1));
    if (!/^\/sahl\/[\w\/.-]+\.(png|jpe?g|webp)$/.test(path)) throw new Error('bad path');
    const r = await fetch(path, { cache: 'no-store' });
    const buf = await r.arrayBuffer();
    if (!window.opener) throw new Error('no opener');
    window.opener.postMessage({ sahlRelay: 1, name: path.split('/').pop(), type: r.headers.get('content-type'), buf }, 'https://www.facebook.com', [buf]);
    s.textContent = 'Sent. This tab can close.';
    setTimeout(() => window.close(), 800);
  } catch (e) { s.textContent = 'Error: ' + e.message; }
})();
</script>
</body></html>
