<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#6 Pinterest + Higgsfield · إعلان بآلاف الدولارات… عملته بصورة من Pinterest | أدهم أبو علان</title>
<meta name="description" content="بتلاقي إعلان احترافي عجبك على Pinterest، وبتعطيه لـ Higgsfield مع صورة منتجك، وبيطلعلك صور وفيديو إعلاني لمنتجك بنفس الستايل والإضاءة.">
<meta name="theme-color" content="#070A08">
<meta property="og:title" content="#6 Pinterest + Higgsfield · إعلان بآلاف الدولارات… عملته بصورة من Pinterest">
<meta property="og:description" content="بتلاقي إعلان احترافي عجبك على Pinterest، وبتعطيه لـ Higgsfield مع صورة منتجك، وبيطلعلك صور وفيديو إعلاني لمنتجك بنفس الستايل والإضاءة.">
<meta property="og:image" content="https://adhamabuallan.github.io/links/hero.jpg">
<meta property="og:url" content="https://adhamabuallan.github.io/links/t/6/">
<link rel="icon" href="../../avatar.jpg">
<link rel="stylesheet" href="../tools.css">
</head>
<body>
<main>
  <a class="back" href="../"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>كل الأدوات</a>

  <p class="kicker"><span class="num" id="num"></span><span id="hook"></span></p>
  <h1 id="tool"></h1>
  <p class="lede" id="desc"></p>
  <p class="facts" id="facts"></p>
  <img class="cover" id="cover" alt="" hidden>

  <a class="btn btn-accent" id="go" href="#" target="_blank" rel="noopener"><span id="goTxt"></span>
    <svg class="flip" width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <p class="note">رابط الموقع الرسمي</p>
  <div class="go-list" id="goList" hidden></div>
  <a class="btn btn-line" id="reel" href="#" target="_blank" rel="noopener" hidden>شوف الريل</a>
  <div id="sections"></div>

  <section id="howWrap" hidden>
    <h2>كيف تستعمله</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <p class="empty" id="missing" hidden>ما لقيت هالأداة. <a href="../" style="color:var(--accent)">شوف كل الأدوات</a></p>
  <footer><a href="../../" dir="ltr">@adham_abu_allan</a></footer>
</main>
<script>
(function(){
  var m=location.pathname.match(/\/t\/(\d+)\/?/); var n=m?+m[1]:null;
  var D=["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  function ar(x){return String(x).replace(/\d/g,function(d){return D[d]})}
  function $(id){return document.getElementById(id)}
  fetch("../../tools.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(data){
    var t=(data.tools||[]).filter(function(x){return x.n===n})[0];
    if(!t){$("missing").hidden=false;return}
    $("num").textContent="#"+t.n;
    $("hook").textContent=t.hook_ar||"";
    $("tool").textContent=t.tool;
    $("desc").textContent=t.desc_ar||"";
    var f=[];
    if(t.price_ar) f.push("السعر: <b></b>");
    if(t.platform_ar) f.push("على: <b></b>");
    $("facts").innerHTML=f.map(function(s){return "<span>"+s+"</span>"}).join("");
    var bs=$("facts").querySelectorAll("b"), i=0;
    if(t.price_ar) bs[i++].textContent=t.price_ar;
    if(t.platform_ar) bs[i++].textContent=t.platform_ar;
    $("go").href=t.url; $("goTxt").textContent="افتح "+t.tool;
    if(t.cover){$("cover").src=t.cover;$("cover").alt=t.tool;$("cover").hidden=false}
    if(t.reel_url){$("reel").href=t.reel_url;$("reel").hidden=false}
    if(t.links&&t.links.length){
      $("go").hidden=true; document.querySelector(".note").hidden=true; $("goList").hidden=false;
      t.links.forEach(function(l,k){var a=document.createElement("a");a.className="btn "+(k?"btn-line":"btn-accent");a.href=l.url;a.target="_blank";a.rel="noopener";
        var sp=document.createElement("span");var b=document.createElement("b");b.textContent=l.label;sp.appendChild(b);
        if(l.sub){var sm=document.createElement("small");sm.textContent=l.sub;sp.appendChild(sm)}
        a.appendChild(sp);a.insertAdjacentHTML("beforeend",'<svg class="flip" width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
        $("goList").appendChild(a)});
    }
    function codeBox(txt){var c=document.createElement("div");c.className="code"+(/[\u0600-\u06FF]/.test(txt)?" ar":"");c.dir="auto";var tx=document.createElement("span");tx.textContent=txt;c.appendChild(tx);
      var bt=document.createElement("button");bt.type="button";bt.className="cp";bt.textContent="نسخ";
      bt.addEventListener("click",function(){var done=function(){bt.textContent="تم ✓";setTimeout(function(){bt.textContent="نسخ"},1500)};
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){})}else{var r=document.createRange();r.selectNodeContents(tx);var g=getSelection();g.removeAllRanges();g.addRange(r)}});
      c.appendChild(bt);return c}
    (t.sections||[]).forEach(function(sec){
      var w=$("sections"), h=document.createElement("h2");h.textContent=sec.title;w.appendChild(h);
      if(sec.intro){var p=document.createElement("p");p.className="sec-intro";p.textContent=sec.intro;w.appendChild(p)}
      var ol=document.createElement("ol");ol.className="steps";
      (sec.steps||[]).forEach(function(st,k){var li=document.createElement("li");var b=document.createElement("b");b.textContent=ar(k+1);
        var d=document.createElement("div");d.className="txt";var sp=document.createElement("span");sp.textContent=typeof st==="string"?st:st.t;d.appendChild(sp);
        if(st&&st.code)d.appendChild(codeBox(st.code));li.appendChild(b);li.appendChild(d);ol.appendChild(li)});
      w.appendChild(ol);
      if(sec.tip){var tp=document.createElement("p");tp.className="tip";tp.textContent=sec.tip;w.appendChild(tp)}
    });
    if(t.steps_ar&&t.steps_ar.length){
      $("howWrap").hidden=false;
      t.steps_ar.forEach(function(s,k){var li=document.createElement("li");var b=document.createElement("b");b.textContent=ar(k+1);var sp=document.createElement("span");sp.textContent=s;li.appendChild(b);li.appendChild(sp);$("steps").appendChild(li)});
    }
  }).catch(function(){$("missing").hidden=false});
})();
</script>
</body>
</html>
